[project]
name = "tangos-take-home-backend"
version = "0.1.0"
description = "Tangos take-home: Sanctions Entity Explorer backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "rapidfuzz>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "httpx>=0.28",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends/Query/Path are the idiomatic way to declare params as
# defaults; they are not the mutable-default footgun B008 guards against.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
